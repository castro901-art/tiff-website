<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiffbot 1.0 — Product Release Poster</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#08090d;color:#f5f2fb;font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
    #poster{width:1080px;margin:0 auto;overflow:hidden;background:#0b0913}
    .hero{display:grid;grid-template-columns:142px 1fr;align-items:center;gap:28px;padding:48px 62px 42px;background:radial-gradient(ellipse at 85% 5%,rgba(145,73,252,.22),transparent 42%),linear-gradient(135deg,#0b0913 0%,#141020 100%)}
    .logo{width:124px;height:146px;object-fit:contain;display:block}
    .eyebrow{margin:0 0 12px;color:#c9a9ff;font-size:17px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0 0 14px;font:800 78px/.97 Syne,'DM Sans',Arial,sans-serif;letter-spacing:-.065em;color:#fff}
    .tagline{max-width:760px;margin:0;color:#e9e2f4;font:600 31px/1.25 Syne,'DM Sans',Arial,sans-serif;letter-spacing:-.025em}
    .art{margin:0;background:#f2eee3;line-height:0}
    .art img{display:block;width:100%;height:auto}
    .details{display:grid;grid-template-columns:.78fr 1.45fr;gap:0;padding:36px 62px 30px;background:#100e18;border-top:1px solid rgba(170,123,255,.38)}
    .date{padding:0 30px 0 0;border-right:1px solid #373141}
    .availability{padding:0 0 0 32px}
    .label{display:block;margin:0 0 9px;color:#a9a4b6;font-size:14px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
    .date-value{margin:0;color:#fff;font:700 24px/1.25 Syne,'DM Sans',Arial,sans-serif}
    .availability-value{margin:0;color:#f5f2fb;font-size:19px;line-height:1.5}
    .footer{padding:0 62px 34px;background:#100e18;color:#aba7b4;font-size:15px;letter-spacing:.02em}
    .footer strong{color:#ddd6e8;font-weight:600}
    @media(max-width:700px){#poster{width:100%}.hero{grid-template-columns:94px 1fr;gap:20px;padding:34px 28px 30px}.logo{width:86px;height:106px}.eyebrow{font-size:12px;letter-spacing:.12em}h1{font-size:clamp(38px,8vw,62px)}.tagline{font-size:clamp(19px,4vw,26px)}.details{grid-template-columns:1fr;gap:24px;padding:28px}.date{border-right:0;border-bottom:1px solid #373141;padding:0 0 20px}.availability{padding:0}.footer{padding:0 28px 28px}}
  </style>
</head>
<body>
  <main id="poster" aria-label="Tiffbot 1.0 product release poster">
    <header class="hero">
      <img class="logo" src="../assets/tiffbot-logo-trimmed.png" alt="Tiffbot logo">
      <div>
        <p class="eyebrow">Trendify Labs · Product Release</p>
        <h1>Tiffbot 1.0</h1>
        <p class="tagline">An AI that doesn't just answer. It gets things done.</p>
      </div>
    </header>
    <figure class="art"><img src="../assets/tiffbot-evolution-artwork.jpg" alt="Hand-drawn code-evolution concept: traditional monolithic code on one side, Trendify in the middle, and modern autonomous systems on the other."></figure>
    <section class="details" aria-label="Release date and availability">
      <div class="date"><span class="label">Release date</span><p class="date-value">November 9, 2026</p></div>
      <div class="availability"><span class="label">Availability</span><p class="availability-value">Available in select countries (Canada) and to select users in other parts of the world.</p></div>
    </section>
    <footer class="footer"><strong>Developed by Trendify Labs.</strong></footer>
  </main>
</body>
</html>
